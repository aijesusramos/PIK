name: pik_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  camera: ^0.12.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  gal: ^3.0.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  http: ^1.6.0
  http_parser: ^4.1.2
  image: ^4.13.1
  image_picker: ^1.2.4
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # LUTs de los filtros (strips PNG generados con tools/generate_lut.py).
  assets:
    - assets/luts/
    - assets/rollos/
    - assets/texturas/
    - assets/iconos/

  # Archivo (Google Fonts, OFL: assets/fuentes/OFL.txt). Instancias fijas de la fuente
  # variable, un archivo por peso: así el peso se respeta igual en Android, iOS y web.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fuentes/Archivo-Regular.ttf
        - asset: assets/fuentes/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fuentes/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/Archivo-Bold.ttf
          weight: 700
    - family: ArchivoExpanded
      fonts:
        - asset: assets/fuentes/ArchivoExpanded-Bold.ttf
          weight: 700
        - asset: assets/fuentes/ArchivoExpanded-ExtraBold.ttf
          weight: 800

  # Fragment shaders: el tool de Flutter los compila al construir la app.
  shaders:
    - shaders/pik_develop.frag
