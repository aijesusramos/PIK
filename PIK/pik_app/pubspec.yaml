name: pik_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  camera: ^0.12.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  gal: ^3.0.1
  http: ^1.6.0
  http_parser: ^4.1.2
  image: ^4.13.1
  image_picker: ^1.2.4
  material_ui: ^1.1.0
  provider: ^6.1.5+1
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # LUTs de los filtros (strips PNG generados con tools/generate_lut.py).
  assets:
    - assets/luts/

  # Fragment shaders: el tool de Flutter los compila al construir la app.
  shaders:
    - shaders/pik_develop.frag
